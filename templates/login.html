<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - BricksChat</title>
    <style>
        body { background-color: #141414; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #232323; padding: 30px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #303030; border: none; color: white; box-sizing: border-box; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #1e5bbf; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .error { color: #ff6b6b; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Вход</h2>
        {% if error %}
            <p class="error">Неверное имя или пароль</p>
        {% endif %}
        <form action="/submit-login" method="POST">
            <input type="text" name="username" placeholder="Имя пользователя" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Нет аккаунта? <a href="/register" style="color: #aaa;">Зарегистрироваться</a></p>
    </div>
</body>
</html>
